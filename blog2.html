<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · 阅读页</title>
    <style>
        /* 简洁重置 + 基础风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fafaf8;   /* 暖白底，护眼舒适 */
            font-family: 'Georgia', 'Times New Roman', '宋体', 'Songti SC', serif;
            line-height: 1.7;
            color: #1e1e1e;
            padding: 1.5rem 1rem;        /* 移动端友好 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 文章卡片容器 —— 保留充足留白，像一本书 */
        .post {
            max-width: 740px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 2px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2.2rem;
            margin: 1.5rem 0 3rem 0;
            position: relative;
        }

        /* 返回按钮区域 — 左上角，视觉独立 */
        .back-header {
            width: 100%;
            max-width: 740px;
            margin-bottom: 0.2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 400;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            color: #5e5e5e;
            text-decoration: none;
            padding: 8px 12px 8px 8px;
            margin-left: -8px;          /* 与文章对齐更舒服 */
            border-radius: 40px;
            transition: background-color 0.2s, color 0.2s;
            letter-spacing: 0.3px;
        }

        .back-btn:hover {
            background-color: #f0f0ec;
            color: #1e1e1e;
            text-decoration: none;
        }

        .back-btn svg {
            fill: currentColor;
            width: 20px;
            height: 20px;
        }

        /* 文章主体排版 */
        .article-title {
            font-size: 2.2rem;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-top: 0.4rem;
            margin-bottom: 0.5rem;
            color: #121212;
            border-bottom: 1px solid #eaeae6;
            padding-bottom: 1rem;
        }

        /* 元数据：作者/日期 可忽略，保留一种沉静感 */
        .meta {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.85rem;
            color: #8f8f8b;
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 文章正文 */
        .content {
            font-size: 1.1rem;
        }

        .content p {
            margin-bottom: 1.6rem;
        }

        .content h2, .content h3 {
            font-weight: 500;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #2a2a28;
        }

        .content blockquote {
            border-left: 4px solid #d4d4ce;
            margin: 1.8rem 0;
            padding: 0.2rem 1.8rem;
            color: #4a4a44;
            font-style: italic;
            background-color: #f9f9f7;
        }

        .content code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #f2f2ee;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.95em;
            color: #2e2e2b;
        }

        .content pre {
            background: #f2f2ee;
            padding: 1.2rem;
            overflow-x: auto;
            border-radius: 4px;
            margin: 1.6rem 0;
            font-size: 0.95rem;
        }

        /* 分隔装饰 */
        hr {
            border: 0;
            height: 1px;
            background: #eaeae6;
            margin: 2rem 0;
        }

        /* 脚注一样淡 */
        .footer-note {
            max-width: 740px;
            width: 100%;
            font-size: 0.8rem;
            color: #b1b1ab;
            font-family: sans-serif;
            text-align: center;
            border-top: 1px solid #eaeae6;
            padding-top: 2rem;
            margin-top: 1rem;
        }

        /* 针对小屏优化 */
        @media (max-width: 500px) {
            body {
                padding: 0.8rem;
            }
            .post {
                padding: 1.8rem 1.5rem;
            }
            .article-title {
                font-size: 1.9rem;
            }
            .back-btn {
                margin-left: -4px;
            }
        }
    </style>
</head>
<body>
    <!-- 左上角返回按钮（独立于文章卡片，保持在统一位置） -->
    <div class="back-header">
        <a href="index.html" class="back-btn" title="返回个人网站">
            <!-- 简单左箭头 SVG -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            <span>返回</span>
        </a>
    </div>

    <!-- 文章阅读卡片 — 你只需替换标题、元数据及 .content 内部内容即可 -->
    <article class="post">
        <!-- 文章标题区域（可替换） -->
        <h1 class="article-title">赌徒</h1>
        <div class="meta">
            <span>海潮</span>
            <span>2025-12-09</span>
        </div>

        <!-- 正文容器：从这里开始粘贴你的文章内容（支持多段落、引用、代码等） -->
        <div class="content">
            <!-- 以下是示例文字，你可以直接全部替换成自己的三篇文章内容（拷贝到这里） -->
            <p>亲爱的<br>一，你掷出骰子<br>一点一点<br>把身体破碎成一片一片筹码</p>
            <p>一，	你押注了八次哲学论断<br>十三次冲动的情绪<br>与五次只剩行动的生活</p>
            <p>一，	你还记得之前的押注<br>你只赌浮在水面上的是空气<br>而非空无一物的天空</p>
            <p>一，你从来都是个赌徒<br>你学会了很多牌技，但你<br>依旧只是个赌徒<br>坐在这广袤的<br>天空下的<br>人造场馆</p>
            <p>一，	习惯这件事<br>习惯一切的未知<br>习惯所有的困难<br>习惯你往后才会浮现代价的选择</p>
            <p>一，	继续赌下去<br>继续只向着气息<br>你坐在赌场里<br>选择着你亲爱的空气</p>
            <hr>

        </div>
        <!-- content 结束 -->
    </article>

    <!-- 极简脚注，只起装饰作用，可删除 -->
    <div class="footer-note">
        <span>◊</span>  <span>阅读 · 静处</span>  <span>◊</span>
    </div>

    <!-- 说明：如何替换文章？ 
         1. 将上面 <h1 class="article-title"> 里的标题改成你自己的。
         2. 调整 <div class="meta"> 里的作者/日期，或者整行删除。
         3. 将 <div class="content"> 里面所有演示内容清空，直接粘贴你的文章正文。
            你可以使用 &lt;p&gt;、&lt;h2&gt;、&lt;blockquote&gt;、&lt;pre&gt; 等任意html标签来保持结构。
         4. 如果需要增加第二篇、第三篇文章，只需复制整个 &lt;article class="post"&gt; 到下一个，并更改内容。
         5. 左上角“返回”按钮默认执行 history.back()，即退回上一页（通常是你的个人网站列表页）。
             如果想直接链接到个人网站首页，可以将 href="javascript:history.back()" 改成 href="/" 或你的绝对网址。
    -->
</body>

</html>
